name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: koi-white

      - uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: koi-black

      - uses: yalongwastaken/git-koi@v1
        with:
          body: asagi
          output-dir: koi-asagi

      - uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi-gold

      - uses: yalongwastaken/git-koi@v1
        with:
          body: platinum
          output-dir: koi-platinum

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi-white/koi.gif koi-black/koi.gif koi-asagi/koi.gif koi-gold/koi.gif koi-platinum/koi.gif
          if git diff --cached --quiet; then
            echo "The koi are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
